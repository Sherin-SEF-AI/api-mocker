version: '3.8'

services:
  api-mocker:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./examples:/app/examples
      - ./templates:/app/templates
    command: start --config /app/examples/ecommerce-api.yaml --host 0.0.0.0
    environment:
      - API_MOCKER_SECRET_KEY=dev-secret-key-do-not-use-in-prod
